<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | NailArt Haven</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top left, #ff9a9e, #f341c0, #fcb69f);
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}
h1 {
  text-align: center;
  color: #ff69b4;
  margin: 30px 0;
}
.order-card {
  background: rgba(255,255,255,0.97);
  max-width: 500px;
  margin: 25px auto;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(255,105,180,0.4);
  text-align: center;
  animation: fadeInUp 0.8s ease;
}
.order-card img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 15px;
  box-shadow: 0 5px 20px rgba(255,182,193,0.6);
}
.order-card h3 { color: #e91e63; margin: 10px 0; }
.order-card p { margin: 8px 0; color: #444; }
.back-btn {
  display: block;
  width: 200px;
  margin: 30px auto;
  padding: 12px;
  background: linear-gradient(135deg, #ff9669, #e91e63);
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 12px;
  font-size: 1.1rem;
}
.back-btn:hover { transform: scale(1.05); }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<h1>My Orders</h1>

<div id="orderList">
  <!-- Orders will be injected here by JavaScript -->
</div>

<a href="home.html" class="back-btn">Back to Home</a>

<script>
// Load and display all orders
const orders = JSON.parse(localStorage.getItem("nailArtOrders") || "[]");
const container = document.getElementById("orderList");

if (orders.length === 0) {
  container.innerHTML = "<p style='text-align:center; font-size:1.3rem; color:#ff69b4;'>No orders yet! Start shopping</p>";
} else {
  // Show newest first
  orders.reverse().forEach(order => {
    container.innerHTML += `
      <div class="order-card">
        <img src="${order.image}" alt="${order.product}">
        <h3>${order.product}</h3>
        <p><strong>Price:</strong> ₹${order.price}</p>
        <p><strong>Name:</strong> ${order.customerName}</p>
        <p><strong>Phone:</strong> ${order.phone}</p>
        <p><strong>Address:</strong> ${order.address}</p>
        <p><strong>Payment:</strong> ${order.paymentMethod === "COD" ? "Cash on Delivery" : order.paymentMethod}</p>
        <p><small>Ordered on: ${order.orderDate}</small></p>
      </div>
    `;
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nail Glam 💅 | Login & Signup</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4, #e91e63);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 105, 180, 0.5);
      overflow: hidden;
      position: relative;
    }

    .form-container {
      display: flex;
      width: 200%;
      transition: transform 0.7s ease-in-out;
    }

    form {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    form.active {
      opacity: 1;
    }

    h2 {
      color: #ff69b4;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ffc0cb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #e584b4;
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
    }

    button {
      background: linear-gradient(135deg, #ff69b4, #e91e63);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    }

    button:hover {
      background: linear-gradient(135deg, #ff80bf, #ff4da6);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
      transform: scale(1.05);
      background: linear-gradient(135deg, #e43b95, #ff1493);
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #e91e63;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      text-decoration: underline;
    }

    .slide {
      transform: translateX(-50%);
    }

    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  
.toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%) translateY(60px) scale(0.8);
  background: linear-gradient(90deg, #ff69b4, #ff9a9e, #fcb69f, #ff69b4);
  background-size: 300% 300%;
  animation: shimmer 2s linear infinite;
  color: white;
  padding: 16px 28px;
  border-radius: 16px;
  font-size: 1rem;
  font-weight: 500;
  font-family: "Poppins", sans-serif;
  box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
  opacity: 0;
  z-index: 999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.toast.hide { opacity: 0; transform: translateX(-50%) translateY(60px) scale(0.8); }

</style>
</head>
<body>

  <div class="container">
    <div class="form-container" id="formContainer">
      
      <!-- LOGIN FORM -->
      <form id="loginForm" class="active">
        <h2>Welcome Back 💖</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="button" id="loginBtn">Login</button>
        <p class="error" id="loginError"></p>
        <button class="toggle-btn" id="toSignup">Create an Account →</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm">
        <h2>Create Account 💅</h2>
        <input type="text" id="signupName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="button" id="signupBtn">Sign Up</button>
        <p class="error" id="signupError"></p>
        <button class="toggle-btn" id="toLogin">← Back to Login</button>
      </form>

    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKuFqq1jYeUon9DgqMnaq6vg1tYDdTnPo",
      authDomain: "website-9a715.firebaseapp.com",
      projectId: "website-9a715",
      storageBucket: "website-9a715.firebasestorage.app",
      messagingSenderId: "1006565436423",
      appId: "1:1006565436423:web:a97c2176e5ead19a350ea2",
      measurementId: "G-TC1052C9MT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ===================== LOGIN =====================
    const loginBtn = document.getElementById("loginBtn");
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const errorMsg = document.getElementById("loginError");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        errorMsg.textContent = "";
        showToast('💅 Successfully Logged In!');
        setTimeout(() => window.location.href = 'home.html', 2000);
      } catch (error) {
        errorMsg.textContent = "⚠️ " + error.message;
      }
    });

    // ===================== SIGNUP =====================
    const signupBtn = document.getElementById("signupBtn");
    signupBtn.addEventListener("click", async () => {
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const errorMsg = document.getElementById("signupError");

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        errorMsg.textContent = "";
        showToast('🌸 Account Created Successfully! Please Log In.');
        toggleToLogin();
      } catch (error) {
        errorMsg.textContent = "⚠️ " + error.message;
      }
    });

    // ===================== ENTER KEY FUNCTIONALITY =====================
    document.getElementById("loginForm").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        loginBtn.click();
      }
    });
    document.getElementById("signupForm").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        signupBtn.click();
      }
    });

    // ===================== TOGGLE ANIMATIONS =====================
    const formContainer = document.getElementById("formContainer");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    document.getElementById("toSignup").addEventListener("click", () => {
      formContainer.classList.add("slide");
      signupForm.classList.add("active");
      loginForm.classList.remove("active");
    });

    document.getElementById("toLogin").addEventListener("click", toggleToLogin);

    function toggleToLogin() {
      formContainer.classList.remove("slide");
      loginForm.classList.add("active");
      signupForm.classList.remove("active");
    }
  
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      toast.classList.remove("hide");
      setTimeout(() => {
        toast.classList.add("hide");
        toast.classList.remove("show");
      }, 3000);
    }
  </script>

  <div id="toast" class="toast">💅 Successfully Logged In!</div>

</body>
</html>

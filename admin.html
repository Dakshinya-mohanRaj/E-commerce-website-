<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | NailArt Haven</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f4f7f6;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #e91e63, #ff4081);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }
    .stat-card h3 { margin: 0; color: #999; font-size: 0.9rem; }
    .stat-card p { margin: 10px 0 0; font-size: 2rem; font-weight: 700; color: #e91e63; }
    
    .order-table-container {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    th { color: #666; font-weight: 600; }
    .status-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
    }
    .customer-info div { font-size: 0.8rem; color: #777; }
    .order-items img {
      width: 40px;
      height: 40px;
      border-radius: 5px;
      object-fit: cover;
      margin-right: 5px;
    }
    .btn-refresh {
      background: #e91e63;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      float: right;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>💅 Admin Control Panel</h1>
    <p>Manage all customer orders and tracking</p>
    <a href="home.html" style="color: white; font-size: 0.9rem; text-decoration: underline;">Go to Shop</a>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>
      <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingOrders">0</p>
      </div>
      <div class="stat-card">
        <h3>Shipped</h3>
        <p id="shippedOrders">0</p>
      </div>
    </div>

    <div class="order-table-container">
      <button class="btn-refresh" onclick="loadOrders()">Reload Data</button>
      <table id="adminOrderTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKuFqq1jYeUon9DgqMnaq6vg1tYDdTnPo",
      authDomain: "website-9a715.firebaseapp.com",
      projectId: "website-9a715",
      storageBucket: "website-9a715.firebasestorage.app",
      messagingSenderId: "1006565436423",
      appId: "1:1006565436423:web:a97c2176e5ead19a350ea2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ✅ AUTH & ADMIN CHECK
    const ADMIN_EMAIL = "admin@gmail.com";
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== ADMIN_EMAIL) {
        alert("Access Denied: You are not an admin!");
        window.location.href = "home.html";
      } else {
        loadOrders();
      }
    });

    async function loadOrders() {
      const orderTableBody = document.getElementById("orderTableBody");
      orderTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center">Loading orders...</td></tr>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        orderTableBody.innerHTML = '';
        
        let total = 0, pending = 0, shipped = 0;
        
        querySnapshot.forEach((docSnap) => {
          const order = docSnap.data();
          const orderId = docSnap.id;
          total++;
          if (order.status === "Pending") pending++;
          if (order.status === "Shipped") shipped++;

          const tr = document.createElement("tr");
          
          // Customer info cell
          const customerCell = `
            <div class="customer-info">
              <b>${order.customerName}</b>
              <div>${order.phone}</div>
              <div>${order.address}</div>
            </div>
          `;

          // Items info cell
          const itemsCell = `<div class="order-items">
            ${(order.items || []).map(item => `<img src="${item.image}" title="${item.name}">`).join('')}
          </div>`;

          tr.innerHTML = `
            <td>#${orderId.substring(0,6)}</td>
            <td>${customerCell}</td>
            <td>${itemsCell}</td>
            <td>₹${order.total}</td>
            <td>
              <select class="status-select" onchange="updateStatus('${orderId}', this.value)">
                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              </select>
            </td>
            <td>${order.date}</td>
          `;
          orderTableBody.appendChild(tr);
        });

        document.getElementById("totalOrders").textContent = total;
        document.getElementById("pendingOrders").textContent = pending;
        document.getElementById("shippedOrders").textContent = shipped;

      } catch (error) {
        console.error("Error loading orders:", error);
        orderTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red">Error loading data.</td></tr>';
      }
    }

    window.updateStatus = async (orderId, newStatus) => {
      try {
        const orderRef = doc(db, "orders", orderId);
        await updateDoc(orderRef, { status: newStatus });
        alert("Status updated to " + newStatus);
        loadOrders(); // Refresh stats
      } catch (error) {
        console.error("Error updating status:", error);
        alert("Wait! Did you update your Firestore Rules? Admin needs permission to write.");
      }
    };

    window.loadOrders = loadOrders;
    document.addEventListener("DOMContentLoaded", loadOrders);
  </script>
</body>
</html>

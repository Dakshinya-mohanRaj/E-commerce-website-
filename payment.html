<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Page | NailArt Haven</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
body {
font-family: 'Poppins', sans-serif;
background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fcb69f);
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}
.payment-container {
background: rgba(255, 255, 255, 0.95);
padding: 40px;
border-radius: 20px;
box-shadow: 0 8px 30px rgba(255, 105, 180, 0.4);
text-align: center;
width: 90%;
max-width: 450px;
animation: fadeInUp 1s ease;
position: relative;
z-index: 2;
}
.close-btn {
position: absolute;
top: 15px;
right: 20px;
font-size: 1.6rem;
color: grey;
background: none;
border: none;
cursor: pointer;
transition: 0.3s ease;
}
.close-btn:hover { transform: scale(1.2); color: red; }
h2 { color: #ff69b4; margin-bottom: 15px; }
img {
width: 200px;
height: 200px;
object-fit: cover;
border-radius: 15px;
box-shadow: 0 5px 25px rgba(255, 182, 193, 0.6);
margin: 20px 0;
transition: transform 0.5s ease;
}
img:hover { transform: scale(1.05) rotate(1deg); }
p { font-size: 1.1rem; color: #444; }
.btn {
background: linear-gradient(135deg, #ff69b4, #e91e63);
color: white;
border: none;
padding: 12px 25px;
border-radius: 10px;
cursor: pointer;
font-size: 1rem;
margin-top: 20px;
transition: 0.3s ease;
}
.btn:hover { transform: scale(1.05); }
.overlay {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
background: rgba(0,0,0,0.4);
display: none;
justify-content: center;
align-items: center;
backdrop-filter: blur(4px);
z-index: 5;
}
.popup {
background: white;
padding: 25px;
border-radius: 15px;
width: 90%;
max-width: 420px;
animation: fadeInUp 0.6s ease;
position: relative;
}
.popup h3 { text-align: center; color: #ff69b4; }
label { display: block; margin-top: 10px; font-weight: 500; }
input, textarea, select {
width: 100%;
padding: 10px;
border: 2px solid #ffb6c1;
border-radius: 8px;
margin-top: 5px;
outline: none;
transition: 0.3s ease;
}
input:focus, textarea:focus, select:focus {
border-color: #e91e63;
box-shadow: 0 0 10px rgba(255,105,180,0.5);
}
.payment-method-row { display: flex; align-items: center; gap: 10px; }
.method-logo {
width: 40px;
height: 40px;
display: none;
border-radius: 8px;
object-fit: contain;
box-shadow: 0 3px 10px rgba(255, 105, 180, 0.3);
}
.toast {
position: fixed;
left: 50%;
bottom: 40px;
transform: translateX(-50%);
background: #ff69b4;
padding: 15px 30px;
border-radius: 15px;
color: white;
font-size: 1rem;
opacity: 0;
transition: 0.4s ease;
z-index: 999;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="payment-container">
  <button class="close-btn" onclick="window.location.href='home.html'">×</button>
  <h2>Proceed to Payment</h2>

  <!-- single product display (used when not checking out cart) -->
  <div id="singleProductDisplay">
    <img id="productImage" src="" alt="Product" />
    <p id="product"></p>
    <p id="price"></p>
  </div>

  <!-- cart summary display (shown when cart checkout) -->
  <div id="cartSummary" style="display:none; text-align:left;">
    <div id="cartItemsList"></div>
    <p id="cartTotal" style="font-weight:600; margin-top:10px;"></p>
  </div>

  <button class="btn" onclick="openPopup()">Pay Now</button>
</div>

<!-- Payment Details Popup -->
<div class="overlay" id="overlay">
  <div class="popup">
    <button class="close-btn" onclick="closePopup()">×</button>
    <h3>Enter Your Details</h3>
    <label>Full Name</label>
    <input type="text" id="name" required>
    <label>Address</label>
    <textarea id="address" required></textarea>
    <label>Phone Number</label>
    <input type="tel" maxlength="10" id="phone" required>
    <label>Payment Method</label>
    <div class="payment-method-row">
      <select id="paymentMethod" onchange="updateLogo()">
        <option value="">Select option</option>
        <option value="COD">Cash on Delivery</option>
        <option value="GPay">Google Pay</option>
        <option value="PhonePe">PhonePe</option>
        <option value="Paytm">Paytm</option>
      </select>
      <img id="methodLogo" class="method-logo" alt="Payment logo">
    </div>
    <button class="btn" onclick="confirmPayment()">Confirm Payment</button>
  </div>
</div>

<div id="toast" class="toast">Payment Successful!</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCKuFqq1jYeUon9DgqMnaq6vg1tYDdTnPo",
    authDomain: "website-9a715.firebaseapp.com",
    projectId: "website-9a715",
    storageBucket: "website-9a715.firebasestorage.app",
    messagingSenderId: "1006565436423",
    appId: "1:1006565436423:web:a97c2176e5ead19a350ea2",
    measurementId: "G-TC1052C9MT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
    } else {
      window.location.href = 'index.html';
    }
  });

  const params = new URLSearchParams(window.location.search);
  const isCart = params.get("cart") === "true";
  let productName = params.get("product");
  let productPrice = params.get("price");
  let productImage = params.get("image");
  let itemsToSave = [];

  if (isCart) {
    const cart = JSON.parse(localStorage.getItem("cartItems") || "[]");
    let total = 0;
    const cartItemsList = document.getElementById("cartItemsList");
    cartItemsList.innerHTML = '';

    cart.forEach(item => {
      const price = Number(item.price) || 0;
      const qty = Number(item.qty) || 1;
      total += price * qty;
      itemsToSave.push({ name: item.name, price: price, qty: qty, image: item.image || "" });

      const div = document.createElement('div');
      div.className = 'summary-item';
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.marginBottom = '10px';
      div.innerHTML = `<img src="${item.image || ""}" style="width:40px;height:40px;border-radius:5px;margin-right:10px;" />
                       <span style="font-size:0.9rem;">${item.name} x${item.qty}</span>
                       <span style="margin-left:auto;font-weight:600;">₹${price * qty}</span>`;
      cartItemsList.appendChild(div);
    });

    productPrice = total;
    document.getElementById('cartTotal').textContent = `Total Payable: ₹${total}`;
    document.getElementById('cartSummary').style.display = 'block';
    document.getElementById('singleProductDisplay').style.display = 'none';
  } else {
    const price = Number(productPrice) || 0;
    itemsToSave.push({ name: productName, price: price, qty: 1, image: productImage || "" });
    document.getElementById("product").textContent = "Product: " + (productName || "N/A");
    document.getElementById("price").textContent = "Price: ₹" + (price || 0);
    const imgElement = document.getElementById("productImage");
    imgElement.src = productImage || "https://cdn-icons-png.flaticon.com/512/263/263142.png";
    productPrice = price; // Ensure it's a number
  }

  window.confirmPayment = async function() {
    const name = document.getElementById("name").value.trim();
    const address = document.getElementById("address").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const paymentMethod = document.getElementById("paymentMethod").value;
    const btn = document.querySelector('.popup .btn');

    if (!name || !address || !phone || !paymentMethod) {
      alert("Please fill all the fields");
      return;
    }
    if (!/^[0-9]{10}$/.test(phone)) {
      alert("Phone number must be 10 digits");
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Processing...';

    try {
      const orderData = {
        userId: currentUser ? currentUser.uid : "Guest",
        customerName: name,
        address: address,
        phone: phone,
        paymentMethod: paymentMethod,
        items: itemsToSave,
        total: productPrice,
        date: new Date().toLocaleString('en-IN'),
        status: "Pending"
      };

      await addDoc(collection(db, "orders"), orderData);

      if (isCart) {
        localStorage.removeItem('cartItems');
      }

      document.getElementById("overlay").style.display = "none";
      const toast = document.getElementById("toast");
      toast.textContent = "🎉 Order Placed Successfully!";
      toast.classList.add("show");

      setTimeout(() => {
        window.location.href = "orders.html";
      }, 2500);

    } catch (error) {
      console.error("Error saving order:", error);
      alert("Something went wrong. Error: " + error.message);
      btn.disabled = false;
      btn.textContent = 'Confirm Payment';
    }
  };

  window.openPopup = () => { document.getElementById("overlay").style.display = "flex"; };
  window.closePopup = () => { document.getElementById("overlay").style.display = "none"; };
  window.updateLogo = () => {
    const method = document.getElementById("paymentMethod").value;
    const logo = document.getElementById("methodLogo");
    const logos = {
      GPay: "https://i.pinimg.com/736x/60/5a/bd/605abdb7af3405c6b20a426b1e128322.jpg",
      PhonePe: "https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/phonepe-icon.png",
      Paytm: "https://upload.wikimedia.org/wikipedia/commons/4/42/Paytm_logo.png"
    };
    if (logos[method]) {
      logo.src = logos[method];
      logo.style.display = "block";
    } else {
      logo.style.display = "none";
    }
  };
</script>
</body>
</html>

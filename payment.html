<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Page | NailArt Haven</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
body {
font-family: 'Poppins', sans-serif;
background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fcb69f);
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}
.payment-container {
background: rgba(255, 255, 255, 0.95);
padding: 40px;
border-radius: 20px;
box-shadow: 0 8px 30px rgba(255, 105, 180, 0.4);
text-align: center;
width: 90%;
max-width: 450px;
animation: fadeInUp 1s ease;
position: relative;
z-index: 2;
}
.close-btn {
position: absolute;
top: 15px;
right: 20px;
font-size: 1.6rem;
color: grey;
background: none;
border: none;
cursor: pointer;
transition: 0.3s ease;
}
.close-btn:hover { transform: scale(1.2); color: red; }
h2 { color: #ff69b4; margin-bottom: 15px; }
img {
width: 200px;
height: 200px;
object-fit: cover;
border-radius: 15px;
box-shadow: 0 5px 25px rgba(255, 182, 193, 0.6);
margin: 20px 0;
transition: transform 0.5s ease;
}
img:hover { transform: scale(1.05) rotate(1deg); }
p { font-size: 1.1rem; color: #444; }
.btn {
background: linear-gradient(135deg, #ff69b4, #e91e63);
color: white;
border: none;
padding: 12px 25px;
border-radius: 10px;
cursor: pointer;
font-size: 1rem;
margin-top: 20px;
transition: 0.3s ease;
}
.btn:hover { transform: scale(1.05); }
.overlay {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
background: rgba(0,0,0,0.4);
display: none;
justify-content: center;
align-items: center;
backdrop-filter: blur(4px);
z-index: 5;
}
.popup {
background: white;
padding: 25px;
border-radius: 15px;
width: 90%;
max-width: 420px;
animation: fadeInUp 0.6s ease;
position: relative;
}
.popup h3 { text-align: center; color: #ff69b4; }
label { display: block; margin-top: 10px; font-weight: 500; }
input, textarea, select {
width: 100%;
padding: 10px;
border: 2px solid #ffb6c1;
border-radius: 8px;
margin-top: 5px;
outline: none;
transition: 0.3s ease;
}
input:focus, textarea:focus, select:focus {
border-color: #e91e63;
box-shadow: 0 0 10px rgba(255,105,180,0.5);
}
.payment-method-row { display: flex; align-items: center; gap: 10px; }
.method-logo {
width: 40px;
height: 40px;
display: none;
border-radius: 8px;
object-fit: contain;
box-shadow: 0 3px 10px rgba(255, 105, 180, 0.3);
}
.toast {
position: fixed;
left: 50%;
bottom: 40px;
transform: translateX(-50%);
background: #ff69b4;
padding: 15px 30px;
border-radius: 15px;
color: white;
font-size: 1rem;
opacity: 0;
transition: 0.4s ease;
z-index: 999;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="payment-container">
  <button class="close-btn" onclick="window.location.href='home.html'">×</button>
  <h2>Proceed to Payment</h2>
  <img id="productImage" src="" alt="Product" />
  <p id="product"></p>
  <p id="price"></p>
  <button class="btn" onclick="openPopup()">Pay Now</button>
</div>

<!-- Payment Details Popup -->
<div class="overlay" id="overlay">
  <div class="popup">
    <button class="close-btn" onclick="closePopup()">×</button>
    <h3>Enter Your Details</h3>
    <label>Full Name</label>
    <input type="text" id="name" required>
    <label>Address</label>
    <textarea id="address" required></textarea>
    <label>Phone Number</label>
    <input type="tel" maxlength="10" id="phone" required>
    <label>Payment Method</label>
    <div class="payment-method-row">
      <select id="paymentMethod" onchange="updateLogo()">
        <option value="">Select option</option>
        <option value="COD">Cash on Delivery</option>
        <option value="GPay">Google Pay</option>
        <option value="PhonePe">PhonePe</option>
        <option value="Paytm">Paytm</option>
      </select>
      <img id="methodLogo" class="method-logo" alt="Payment logo">
    </div>
    <button class="btn" onclick="confirmPayment()">Confirm Payment</button>
  </div>
</div>

<div id="toast" class="toast">Payment Successful!</div>

<script>
const params = new URLSearchParams(window.location.search);
const isCart = params.get("cart") === "true";          // boolean flag
let productName = params.get("product");
let productPrice = params.get("price");
let productImage = params.get("image");

// if user landed here with no product and not coming from cart, send them back
if (!isCart && !productName) {
  window.location.href = 'home.html';
}

// CART CHECKOUT
if (isCart) {
  const cart = JSON.parse(localStorage.getItem("cartItems") || "[]");

  let total = 0;
  let names = [];

  cart.forEach(item => {
    total += item.price * item.qty;
    names.push(item.name + " x" + item.qty);
  });

  // overwrite values with cart summary
  productName = names.join(", ");
  productPrice = total;
  productImage = "https://cdn-icons-png.flaticon.com/512/263/263142.png";
}

// convert price to number for consistent formatting
productPrice = Number(productPrice) || 0;

document.getElementById("product").textContent = "Product: " + (productName || "N/A");
document.getElementById("price").textContent = "Price: ₹" + (productPrice || 0);
const imgElement = document.getElementById("productImage");

if(productImage && productImage !== "null"){
  imgElement.src = productImage;
}else{
  imgElement.src = "https://cdn-icons-png.flaticon.com/512/263/263142.png"; 
}

function openPopup() { document.getElementById("overlay").style.display = "flex"; }
function closePopup() {
  document.getElementById("overlay").style.display = "none";
  // clear form fields
  document.getElementById("name").value = '';
  document.getElementById("address").value = '';
  document.getElementById("phone").value = '';
  document.getElementById("paymentMethod").value = '';
  document.getElementById("methodLogo").style.display = 'none';
}

// Save order + show success
function confirmPayment() {
  const name = document.getElementById("name").value.trim();
  const address = document.getElementById("address").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const paymentMethod = document.getElementById("paymentMethod").value;
  const btn = document.querySelector('.popup .btn');

  // basic validation
  if (!name || !address || !phone || !paymentMethod) {
    alert("Please fill all the fields");
    return;
  }
  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Phone number must be 10 digits");
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Processing...';

  const order = {
    id: Date.now(),
    product: productName,
    price: productPrice,
    image: productImage,
    customerName: name,
    address: address,
    phone: phone,
    paymentMethod: paymentMethod,
    orderDate: new Date().toLocaleString('en-IN')
  };

  let orders = JSON.parse(localStorage.getItem("nailArtOrders") || "[]");
  orders.push(order);
  localStorage.setItem("nailArtOrders", JSON.stringify(orders));

  // if this was a cart checkout, clear the saved cart
  if (isCart) {
    localStorage.removeItem('cartItems');
  }

  closePopup();
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
    window.location.href = "orders.html";
  }, 2000);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Page 💳 | NailArt Haven</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fcb69f);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .payment-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(255, 105, 180, 0.4);
      text-align: center;
      width: 90%;
      max-width: 450px;
      animation: fadeInUp 1s ease;
      position: relative;
      z-index: 2;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.6rem;
      color: grey;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .close-btn:hover {
      transform: scale(1.2);
      color: red;
    }

    h2 { 
      color: #ff69b4; 
      margin-bottom: 15px; 
    }

    img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(255, 182, 193, 0.6);
      margin: 20px 0;
      transition: transform 0.5s ease;
    }

    img:hover { transform: scale(1.05) rotate(1deg); }

    p { font-size: 1.1rem; color: #444; margin: 5px 0; }

    .btn {
      background: linear-gradient(135deg, #ff69b4, #e91e63);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, #e43b95, #ff1493);
      transform: scale(1.05);
    }

    /* Overlay for popup */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5;
      backdrop-filter: blur(5px);
    }

    .popup {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 420px;
      text-align: left;
      box-shadow: 0 8px 30px rgba(255, 105, 180, 0.4);
      animation: fadeInUp 0.6s ease;
      position: relative;
    }

    .popup h3 {
      color: #ff69b4;
      text-align: center;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: #444;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ffb6c1;
      border-radius: 8px;
      font-family: 'Poppins';
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #e91e63;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
    }

    textarea {
      resize: none;
      height: 60px;
    }

    .payment-method-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .method-logo {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 3px 10px rgba(255, 105, 180, 0.3);
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }

    .method-logo.show {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Toast shimmer */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(60px) scale(0.8);
      background: linear-gradient(90deg, #ff69b4, #ff9a9e, #fcb69f, #ff69b4);
      background-size: 150% 150%;
      animation: shimmer 5s linear infinite;
      color: white;
      padding: 18px 30px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 200;
      font-family: "Poppins", sans-serif;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
      opacity: 0;
      z-index: 999;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    .toast.hide { opacity: 0; transform: translateX(-50%) translateY(60px) scale(0.8); }

  </style>
</head>
<body>

  <div class="payment-container">
    <button class="close-btn" onclick="window.location.href='home.html'">×</button>
    <h2>Proceed to Payment</h2>
    <img id="productImage" src="" alt="Product Image" />
    <p id="product"></p>
    <p id="price"></p>
    <button class="btn" onclick="openPopup()">Pay Now 💳</button>
  </div>

  <!-- Popup Form -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <button class="close-btn" onclick="closePopup()">×</button>
      <h3>Enter Your Details 📝</h3>

      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name" required>

      <label>Address</label>
      <textarea id="address" placeholder="Your delivery address" required></textarea>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit phone number" maxlength="10" required>

      <label>Payment Method</label>
      <div class="payment-method-row">
        <select id="paymentMethod" required onchange="updateLogo()">
          <option value="">Select option</option>
          <option value="COD">Cash on Delivery</option>
          <option value="GPay">Google Pay</option>
          <option value="PhonePe">PhonePe</option>
          <option value="Paytm">Paytm</option>
        </select>
        <img id="methodLogo" class="method-logo" alt="Logo">
      </div>

      <button class="btn" onclick="confirmPayment()">Confirm Payment ✅</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">💖 Payment Successful!</div>

      document.getElementById("overlay").style.display = "flex";

    function confirmPayment() {
      const name = document.getElementById("name").value.trim();
      const address = document.getElementById("address").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const method = document.getElementById("paymentMethod").value;

      if (!name || !address || !phone || !method) {
        showToast("⚠️ Please fill in all fields!");
        return;
      }

      document.getElementById("overlay").style.display = "none";
      showToast(`💅 ${method} Payment for "${product}" Confirmed! Thank you, ${name}.`);
      setTimeout(() => {
        window.location.href = "home.html";
      }, 3500);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
        toast.classList.add("hide");
      }, 3000);
    }
  </script>
